; PlatformIO Project Configuration
; Standalone Nordic Legacy DFU updater (XIAO nRF52840 / RAK4631)

[env]
platform = nordicnrf52
platform_packages =
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
framework = arduino
upload_protocol = nrfutil
monitor_speed = 115200
monitor_filters = direct
build_flags =
  ; The Adafruit nRF52 BSP ships with nrfx QSPI disabled. Without this flag
  ; nrfx_qspi_init() is a no-op stub and every flash read returns 0xFF.
  -D NRFX_QSPI_ENABLED=1
build_src_filter =
  +<*>
  -<v4/*>
lib_deps =
  adafruit/Adafruit SPIFlash
  adafruit/SdFat - Adafruit Fork
  bblanchon/ArduinoJson @ ^7

[env:xiao_nrf52840]
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags =
  ${env.build_flags}
  -I variants/xiao_nrf52
  -D BOARD_XIAO_NRF52840
build_src_filter =
  ${env.build_src_filter}
  +<../variants/xiao_nrf52>

[env:rak4631]
board = rak4631
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags =
  ${env.build_flags}
  -I variants/rak4631
  -D BOARD_RAK4631
build_src_filter =
  ${env.build_src_filter}
  +<../variants/rak4631>

; Experimental ESP32-S3 Nordic Legacy DFU central for Heltec WiFi LoRa 32 V4.
; The V4 stages a ZIP in its dedicated SPIFFS partition through an explicitly
; framed, SHA-256 checked serial upload; it does not expose the flash as MSC.
[env:heltec_v4]
platform = platformio/espressif32@6.11.0
platform_packages =
framework = arduino
board = heltec_v4
board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs
board_build.variants_dir = variants
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = direct
build_flags =
  -D BOARD_HELTEC_V4
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -D CONFIG_BT_NIMBLE_LOG_LEVEL=5
  -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
  -Wall
  -Wextra
  -Werror
build_src_filter =
  -<*>
  +<dfu_image_layout.cpp>
  +<config_parse.cpp>
  +<v4/*>
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  h2zero/NimBLE-Arduino @ 1.4.2
